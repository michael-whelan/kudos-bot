# Create the Slack app from this manifest:
# api.slack.com/apps -> Create New App -> From an app manifest -> paste this.
display_information:
  name: Kudos
  description: Give teammates public or private kudos tied to Biorce values
  background_color: "#2f6fed"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Kudos
    always_online: true
  shortcuts:
    - name: Give kudos
      type: global
      callback_id: give_kudos
      description: Open the kudos form
    - name: Give kudos for this message
      type: message
      callback_id: kudos_for_message
      description: Send kudos to this message's author
  slash_commands:
    - command: /kudos
      description: Give someone kudos (public or private)
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - users:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
